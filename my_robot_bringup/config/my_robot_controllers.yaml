controller_manager:
  ros__parameters:
    update_rate: 5
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    action_ns: follow_joint_trajectory
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false
    gains:
      joint1: {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      joint2: {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      joint3: {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      joint4: {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      joint5: {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}

gripper_controller:
  ros__parameters:
    joints:
      - joint6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    action_ns: follow_joint_trajectory
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false
    gains:
      joint6: {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
